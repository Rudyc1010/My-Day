# IMPORTANT: in your GitHub repo this file must be created at the path:
#   .github/workflows/checker.yml
# (The setup guide walks you through it.)

name: Overdue task checker

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you run it manually with a button

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for overdue tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MYDAY_EMAIL: ${{ secrets.MYDAY_EMAIL }}
          MYDAY_PASSWORD: ${{ secrets.MYDAY_PASSWORD }}
          TZ_NAME: "America/Los_Angeles"
          BRIEFING_TIME: "07:00"  # morning briefing push
          SUMMARY_TIME: "20:30"   # end-of-day wrap-up push
          WEEKLY_TIME: "19:00"    # Sunday weekly review push
        run: python checker.py
